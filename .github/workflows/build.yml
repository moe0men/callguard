name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build universal APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CallGuard-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-1.0.0
          path: CallGuard-1.0.0.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CallGuard ${{ github.ref_name }}
          body: |
            Универсальный APK: один файл на все устройства, без разделения по ABI.

            Установка: скачать `CallGuard-1.0.0.apk`, разрешить установку из неизвестных источников, открыть приложение, выдать роль определителя номера и доступ к контактам.
          files: CallGuard-1.0.0.apk
          make_latest: true
